name: lint

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install lint tools
        run: pip install "ruff==0.14.13" "pydocstyle==6.3.0" "darglint==1.8.1" toml

      - name: ruff check
        run: ruff check .

      - name: ruff format --check
        run: ruff format --check src/micropurc tests

      - name: pydocstyle
        run: pydocstyle src/micropurc

      - name: darglint
        run: |
          darglint --docstring-style google --strictness long \
            $(find src/micropurc -name '*.py' ! -path '*/forward/base.py')
